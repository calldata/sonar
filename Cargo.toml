[workspace]
members = ["crates/sonar-cli", "crates/sonar-sim", "crates/sonar-idl"]
default-members = ["crates/sonar-cli"]
resolver = "2"

[workspace.package]
rust-version = "1.86.0"

[workspace.dependencies]
sonar-idl = { path = "crates/sonar-idl" }
sonar-sim = { path = "crates/sonar-sim" }
anyhow = "1.0"
assert_cmd = "2.0"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
chrono = { version = "0.4.43", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
clap_complete = "4"
colored = "2.1"
env_logger = "0.11"
flate2 = "1.0"
heck = "0.5"
hex = "0.4"
indicatif = "0.17"
insta = "1.42"
litesvm = "0.16.0"
log = "0.4"
num-bigint = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10.9"
solana-account = "4.3"
solana-address-lookup-table-interface = "3.1"
solana-clock = "3.1"
solana-commitment-config = "3.1"
solana-epoch-schedule = "3.2"
solana-hash = "4.5"
solana-instruction = "3.4"
solana-keypair = "3.1"
# 8.0 matches what litesvm 0.16 depends on (and carries the `wincode` feature the
# state types need). agave's 4.2 crates require "7.0.0" with a caret, which cannot
# resolve to 8.x, so Cargo.lock holds both copies until agave widens that range.
solana-loader-v3-interface = { version = "8.0", features = ["wincode"] }
solana-message = "4.2"
solana-native-token = "3.0"
solana-nullable = "1.3"
solana-nonce = "3.2"
solana-pubkey = "4.2"
solana-rent = "4.3"
solana-sdk-ids = "3.1"
solana-signature = "3.4"
solana-signer = "3.0"
solana-slot-hashes = "3.1"
solana-sysvar-id = "3.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1"
solana-transaction-status-client-types = { version = "4.2", features = ["agave-unstable-api"] }
solana-zk-sdk-pod = "0.1"
spl-pod = "0.7.4"
spl-token = "9.0.0"
spl-token-2022 = "11.0.0"
spl-token-2022-interface = "3.1"
spl-token-group-interface = "0.7.2"
spl-token-metadata-interface = "1.0"
tempfile = "3.26.0"
terminal_size = "0.4"
thiserror = "2.0.18"
toml = "0.9.12"
unicode-width = "0.2.2"
ureq = { version = "3", features = ["json"] }
wincode = "0.5"
